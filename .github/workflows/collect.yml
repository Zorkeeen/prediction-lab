name: collect

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Collect snapshots
        run: python3 collect.py 2>&1 | tee run.log
      - name: Commit and push
        run: |
          git config user.name "collect-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || { git commit -m "snapshot $(date -u +%FT%H:%M)"; git pull --rebase --autostash origin main; git push origin main; }
      - name: Daily digest
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "$(date -u +%H)" = "12" ]; then python3 notify.py digest; fi

      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 notify.py fail "https://github.com/Zorkeeen/prediction-lab/actions/runs/${{ github.run_id }}" || true
