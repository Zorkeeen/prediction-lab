name: backfill

on:
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Backfill chunk
        run: python3 backfill.py 2>&1 | tee run.log
      - name: Commit and push
        run: |
          git config user.name "collect-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || { git commit -m "backfill chunk $(date -u +%FT%H:%M)"; git pull --rebase --autostash origin main; git push origin main; }
      - name: Notify progress
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 notify.py backfill || true

      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 notify.py fail "https://github.com/Zorkeeen/prediction-lab/actions/runs/${{ github.run_id }}" || true
